<!DOCTYPE html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ficha de trabajo · Kit 4.0</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F3F5F1; --panel:#FFFFFF; --panel-2:#F8F9F6;
  --ink:#16202A; --ink-2:#4C5A66; --ink-3:#7A8792;
  --line:#D7DCD4; --line-2:#E8EBE5;
  --steel:#23506E; --steel-soft:#E3EDF4;
  --amber:#D9930B; --amber-soft:#FAEFD4; --amber-line:#E7C171;
  --green:#25714C; --green-soft:#DFF0E6;
  --red:#B33F32; --red-soft:#F9E3E0;
  --shadow:0 1px 0 rgba(22,32,42,.05);
  --sans:"IBM Plex Sans","Segoe UI",Helvetica,Arial,sans-serif;
  --mono:"IBM Plex Mono","SFMono-Regular",Consolas,monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#12181D; --panel:#1B232A; --panel-2:#212B33;
    --ink:#E8EDF0; --ink-2:#A3B0BA; --ink-3:#7C8892;
    --line:#2F3B45; --line-2:#27323A;
    --steel:#7DB4D8; --steel-soft:#1E2E3B;
    --amber:#EDB042; --amber-soft:#33280F; --amber-line:#7A5F20;
    --green:#5FBF8E; --green-soft:#163024;
    --red:#E27F6F; --red-soft:#331D19;
    --shadow:0 1px 0 rgba(0,0,0,.3);
  }
}
:root[data-theme="dark"]{
  --paper:#12181D; --panel:#1B232A; --panel-2:#212B33;
  --ink:#E8EDF0; --ink-2:#A3B0BA; --ink-3:#7C8892;
  --line:#2F3B45; --line-2:#27323A;
  --steel:#7DB4D8; --steel-soft:#1E2E3B;
  --amber:#EDB042; --amber-soft:#33280F; --amber-line:#7A5F20;
  --green:#5FBF8E; --green-soft:#163024;
  --red:#E27F6F; --red-soft:#331D19;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--paper); color:var(--ink);
  font-family:var(--sans); font-size:16px; line-height:1.5;
  -webkit-text-size-adjust:100%;
}
h1,h2,h3,h4{margin:0; font-weight:600; line-height:1.25; letter-spacing:-.01em}
p{margin:0 0 .7em}
button{font:inherit; color:inherit; cursor:pointer}
input,textarea,select{font:inherit; color:inherit}
:focus-visible{outline:2px solid var(--steel); outline-offset:2px; border-radius:3px}
@media (prefers-reduced-motion:reduce){*{transition:none!important; animation:none!important}}

/* ---------- top bar ---------- */
.bar{
  position:sticky; top:0; z-index:20; background:var(--panel);
  border-bottom:1px solid var(--line);
  display:flex; align-items:center; gap:16px; padding:10px 20px; flex-wrap:wrap;
}
.mark{display:flex; align-items:baseline; gap:9px; margin-right:auto}
.mark b{font-size:17px; font-weight:700; letter-spacing:-.02em}
.mark span{font-size:12.5px; color:var(--ink-3)}
.who{
  font-size:13px; color:var(--ink-2); border-left:1px solid var(--line);
  padding-left:14px; max-width:34ch; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
}
.clock{
  display:flex; align-items:center; gap:8px; background:var(--panel-2);
  border:1px solid var(--line); border-radius:999px; padding:3px 5px 3px 12px;
}
.clock output{font-family:var(--mono); font-size:15px; font-weight:600; font-variant-numeric:tabular-nums; min-width:5ch}
.clock.over output{color:var(--red)}
.mini{
  background:transparent; border:1px solid var(--line); border-radius:999px;
  padding:3px 11px; font-size:12.5px; color:var(--ink-2);
}
.mini:hover{background:var(--panel-2); color:var(--ink)}

/* ---------- shell ---------- */
.shell{display:grid; grid-template-columns:238px minmax(0,1fr); gap:0; align-items:start}
.rail{
  position:sticky; top:57px; align-self:start; padding:22px 12px 40px 20px;
  border-right:1px solid var(--line); height:calc(100vh - 57px); overflow-y:auto;
}
.rail h5{
  margin:20px 0 8px; font-size:11.5px; font-weight:600; color:var(--ink-3);
  letter-spacing:.03em;
}
.rail h5:first-child{margin-top:0}
.stepbtn{
  display:grid; grid-template-columns:22px 1fr; gap:9px; align-items:start; width:100%;
  background:transparent; border:0; border-radius:7px; padding:7px 9px 7px 6px;
  text-align:left; color:var(--ink-2); font-size:14px; line-height:1.3;
}
.stepbtn:hover{background:var(--panel-2); color:var(--ink)}
.stepbtn .n{
  font-family:var(--mono); font-size:11px; font-weight:600; color:var(--ink-3);
  border:1px solid var(--line); border-radius:5px; text-align:center; padding:1px 0; margin-top:1px;
}
.stepbtn .t small{display:block; font-size:11.5px; color:var(--ink-3); margin-top:1px}
.stepbtn[aria-current="true"]{background:var(--panel); color:var(--ink); font-weight:600; box-shadow:inset 3px 0 0 var(--amber)}
.stepbtn[aria-current="true"] .n{background:var(--amber); border-color:var(--amber); color:#16202A}
.stepbtn.done .n{background:var(--green-soft); border-color:var(--green); color:var(--green)}

main{padding:30px 34px 90px; max-width:none}
.wrap{max-width:940px}

/* ---------- step head ---------- */
.head{margin-bottom:20px; padding-bottom:16px; border-bottom:1px solid var(--line)}
.head h2{font-size:26px; letter-spacing:-.025em}
.head .lede{margin:8px 0 0; color:var(--ink-2); font-size:15px; max-width:66ch}

.panel{background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:18px 20px; margin-bottom:16px; box-shadow:var(--shadow)}
.panel > h3{font-size:16px; margin-bottom:4px}
.panel .sub{font-size:13.5px; color:var(--ink-2); margin:0 0 14px; max-width:70ch}

label.f{display:block; font-size:13px; font-weight:500; color:var(--ink-2); margin-bottom:5px}
input[type=text],input[type=date],textarea,select{
  width:100%; background:var(--panel-2); border:1px solid var(--line);
  border-radius:7px; padding:9px 11px; font-size:15px;
}
textarea{resize:vertical; min-height:64px; line-height:1.45}
input::placeholder,textarea::placeholder{color:var(--ink-3)}
input:focus,textarea:focus,select:focus{background:var(--panel); border-color:var(--steel); outline:none; box-shadow:0 0 0 3px var(--steel-soft)}
.grid2{display:grid; grid-template-columns:1fr 1fr; gap:14px}
.grid3{display:grid; grid-template-columns:2fr 1fr 1fr; gap:12px}

/* ---------- pain cards ---------- */
.pain{border:1px solid var(--line); border-radius:9px; padding:14px; margin-bottom:11px; background:var(--panel-2); position:relative}
.pain .idx{position:absolute; left:-1px; top:-1px; font-family:var(--mono); font-size:11px; font-weight:600; background:var(--panel); border:1px solid var(--line); border-radius:9px 0 9px 0; padding:2px 8px; color:var(--ink-3)}
.pain .body{padding-top:12px}
.pain .cost{margin-top:10px}
.del{position:absolute; right:8px; top:8px; background:transparent; border:0; color:var(--ink-3); font-size:18px; line-height:1; padding:2px 6px; border-radius:5px}
.del:hover{color:var(--red); background:var(--red-soft)}
.flag{margin-top:8px; font-size:13px; color:var(--amber); background:var(--amber-soft); border:1px solid var(--amber-line); border-radius:7px; padding:7px 10px}
.bank{display:flex; flex-wrap:wrap; gap:7px}
.chip{background:var(--panel-2); border:1px solid var(--line); border-radius:999px; padding:5px 12px; font-size:13.5px; color:var(--ink-2)}
.chip:hover{border-color:var(--steel); color:var(--steel); background:var(--steel-soft)}
.add{background:var(--panel); border:1px dashed var(--line); border-radius:9px; padding:10px 16px; font-size:14px; color:var(--ink-2); width:100%}
.add:hover{border-color:var(--steel); color:var(--steel)}

/* ---------- axis picker ---------- */
.axes{display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:10px}
.axis{display:flex; gap:10px; align-items:flex-start; border:1px solid var(--line); border-radius:9px; padding:11px 13px; background:var(--panel-2); text-align:left; font-size:14.5px; line-height:1.35}
.axis:hover{border-color:var(--steel)}
.axis[aria-pressed="true"]{background:var(--amber-soft); border-color:var(--amber); color:var(--ink); font-weight:600}
.axis .tick{width:17px; height:17px; flex:none; border:1.5px solid var(--line); border-radius:5px; margin-top:1px}
.axis[aria-pressed="true"] .tick{background:var(--amber); border-color:var(--amber)}
.metric{display:grid; grid-template-columns:1fr 150px; gap:10px; align-items:end; padding:11px 0; border-bottom:1px solid var(--line-2)}
.metric:last-child{border-bottom:0}
.metric .nm{font-size:14.5px; font-weight:500}

/* ---------- matrix ---------- */
.tablewrap{overflow-x:auto; border:1px solid var(--line); border-radius:10px; background:var(--panel)}
table{border-collapse:collapse; width:100%; min-width:760px; font-size:14px}
th,td{padding:9px 10px; text-align:left; border-bottom:1px solid var(--line-2); vertical-align:middle}
thead th{background:var(--panel-2); font-size:12px; font-weight:600; color:var(--ink-2); border-bottom:1px solid var(--line); line-height:1.25}
thead th small{display:block; font-weight:400; color:var(--ink-3); font-size:11px}
tbody tr:last-child td{border-bottom:0}
tbody tr.pri{background:var(--amber-soft)}
td.name{font-weight:500; min-width:210px; max-width:280px}
td.name .rank{font-family:var(--mono); font-size:11px; color:var(--ink-3); margin-right:6px}
.sel{width:100%; padding:5px 7px; border-radius:6px; background:var(--panel-2); border:1px solid var(--line); font-size:13.5px}
td.score{font-family:var(--mono); font-weight:600; font-variant-numeric:tabular-nums; text-align:right; white-space:nowrap}
.qw{display:inline-block; font-size:10.5px; font-weight:600; color:var(--green); background:var(--green-soft); border-radius:4px; padding:1px 6px; margin-left:6px; vertical-align:1px}
.pick{width:19px; height:19px; accent-color:var(--amber)}

.formula{font-size:12.5px; color:var(--ink-3); margin-top:10px; font-family:var(--mono)}
.plot{width:100%; height:auto; display:block}
.note{border-left:3px solid var(--steel); background:var(--steel-soft); padding:11px 14px; border-radius:0 8px 8px 0; font-size:14px; margin:14px 0 0}
.warn{border-left-color:var(--amber); background:var(--amber-soft)}

/* ---------- kits ---------- */
.kitgrid{display:grid; grid-template-columns:repeat(auto-fill,minmax(255px,1fr)); gap:11px}
.kit{border:1px solid var(--line); border-radius:9px; padding:13px 14px; background:var(--panel-2); text-align:left; display:flex; flex-direction:column; gap:6px}
.kit:hover{border-color:var(--steel)}
.kit[aria-pressed="true"]{border-color:var(--amber); background:var(--amber-soft); box-shadow:inset 0 0 0 1px var(--amber)}
.kit .code{font-family:var(--mono); font-size:11px; font-weight:600; color:var(--ink-3)}
.kit .nm{font-size:14.5px; font-weight:600; line-height:1.3}
.kit .ob{font-size:12.5px; color:var(--ink-2); line-height:1.4}
.kit .sug{align-self:flex-start; font-size:10.5px; font-weight:600; color:var(--steel); background:var(--steel-soft); border-radius:4px; padding:1px 6px}
.fam{margin:18px 0 9px; font-size:12.5px; font-weight:600; color:var(--ink-3)}
.fam:first-child{margin-top:0}
.sym{margin:12px 0 0; padding:12px 14px; background:var(--panel-2); border:1px solid var(--line-2); border-radius:8px}
.sym h4{font-size:12.5px; color:var(--ink-2); margin-bottom:7px}
.sym ul{margin:0; padding-left:17px; font-size:13.5px; color:var(--ink-2); line-height:1.5}

/* ---------- readiness ---------- */
.dim{border:1px solid var(--line); border-radius:9px; padding:14px 15px; margin-bottom:11px; background:var(--panel-2)}
.dim h4{font-size:15px; margin-bottom:3px}
.dim .q{font-size:13.5px; color:var(--ink-2); margin:0 0 11px; line-height:1.45}
.lights{display:flex; gap:7px; flex-wrap:wrap; margin-bottom:10px}
.light{border:1px solid var(--line); background:var(--panel); border-radius:7px; padding:6px 13px; font-size:13.5px; display:flex; align-items:center; gap:7px}
.light i{width:9px; height:9px; border-radius:50%; background:var(--line); display:block}
.light[data-v="1"] i{background:var(--red)} .light[data-v="2"] i{background:var(--amber)} .light[data-v="3"] i{background:var(--green)}
.light[aria-pressed="true"]{font-weight:600; border-color:var(--ink-2); box-shadow:inset 0 0 0 1px var(--ink-2)}
.verdict{display:flex; gap:18px; align-items:center; flex-wrap:wrap; padding:14px 16px; border-radius:9px; background:var(--panel-2); border:1px solid var(--line)}
.verdict .txt{flex:1; min-width:200px}
.verdict .txt b{display:block; font-size:16px; margin-bottom:2px}
.verdict .txt span{font-size:13.5px; color:var(--ink-2)}

/* ---------- actions ---------- */
.act{display:grid; grid-template-columns:1fr 180px 160px; gap:11px; margin-bottom:11px; align-items:end}

/* ---------- nav ---------- */
.nav{display:flex; gap:10px; align-items:center; margin-top:24px; padding-top:18px; border-top:1px solid var(--line)}
.btn{background:var(--ink); color:var(--paper); border:1px solid var(--ink); border-radius:8px; padding:10px 20px; font-size:15px; font-weight:500}
.btn:hover{opacity:.88}
.btn.ghost{background:transparent; color:var(--ink-2); border-color:var(--line)}
.btn.ghost:hover{color:var(--ink); border-color:var(--ink-2); opacity:1}
.nav .spacer{margin-left:auto}
.hint{font-size:13px; color:var(--ink-3)}

/* ---------- summary ---------- */
.sheet h3{font-size:13px; color:var(--ink-3); margin:22px 0 9px; padding-bottom:5px; border-bottom:1px solid var(--line)}
.sheet h3:first-child{margin-top:0}
.sheet .row{padding:10px 0; border-bottom:1px solid var(--line-2)}
.sheet .row:last-child{border-bottom:0}
.sheet .row b{font-size:15px; display:block}
.sheet .row .meta{font-size:13.5px; color:var(--ink-2); margin-top:3px}
.sheet .kitline{font-family:var(--mono); font-size:12.5px; color:var(--steel); font-weight:600}
.empty{color:var(--ink-3); font-size:14px; font-style:italic}

@media (max-width:900px){
  .shell{grid-template-columns:1fr}
  .rail{position:static; height:auto; border-right:0; border-bottom:1px solid var(--line); display:flex; gap:6px; overflow-x:auto; padding:10px 14px}
  .rail h5{display:none}
  .stepbtn{width:auto; flex:none; grid-template-columns:auto; gap:0; padding:6px 12px; border:1px solid var(--line); border-radius:999px; white-space:nowrap; font-size:13px}
  .stepbtn .n{display:none} .stepbtn .t small{display:none}
  main{padding:20px 16px 70px}
  .grid2,.grid3,.act{grid-template-columns:1fr}
  .head h2{font-size:22px}
  .who{display:none}
}
@media print{
  .bar,.rail,.nav,.noprint{display:none!important}
  body{background:#fff; font-size:11.5pt}
  .shell{display:block}
  main{padding:0}
  .panel{border:0; padding:0; box-shadow:none; page-break-inside:avoid}
  .sheet h3{page-break-after:avoid}
}

/* ---------- marca institucional ---------- */
.brandbar{background:#16202A;display:flex;align-items:center;justify-content:space-between;padding:8px 20px;gap:16px}
.brandbar img{height:24px;width:auto;display:block}
.brandbar img.afac{height:28px}
.instfoot{background:#F3F5F1;border-top:1px solid #D7DCD4;padding:16px 20px;display:flex;align-items:center;justify-content:center;gap:44px;flex-wrap:wrap}
.instfoot img{height:30px;width:auto;display:block}
@media (max-width:900px){
  .brandbar img{height:19px} .brandbar img.afac{height:22px}
  .instfoot{gap:26px;padding:12px 16px} .instfoot img{height:23px}
}

/* ---------- modal de confirmación (reemplaza confirm() nativo) ---------- */
.modalbg{position:fixed;inset:0;background:rgba(22,32,42,.5);display:flex;align-items:center;justify-content:center;padding:20px;z-index:50}
.modalbg[hidden]{display:none}
.modalbox{background:var(--panel);border-radius:10px;max-width:420px;width:100%;padding:22px;box-shadow:0 8px 30px rgba(0,0,0,.25)}
.modalbox h4{margin:0 0 10px;font-size:16px;color:var(--ink)}
.modalbox p{margin:0 0 18px;font-size:14px;color:var(--ink-2);line-height:1.45}
.modalbox .row{display:flex;gap:10px;justify-content:flex-end}
</style>
</head>

function blank(){
  return {step:0, modo:"propio", empresa:"", persona:"", rol:"",
    dolores:[nd(),nd(),nd(),nd()], ejes:[], ejeCustom:{}, metricas:{}, scores:{},
    prio:[], kits:{}, ready:{},

}
function nd(){ return {id:"d"+Math.random().toString(36).slice(2,8), t:"", c:"", prov:""}; }
function isCadena(){ return S.modo==="cadena"; }
function load(){
  try{ var r=localStorage.getItem(KEY); if(r){ var o=JSON.parse(r); var b=blank();
    for(var k in b){ if(!(k in o)) o[k]=b[k]; } return o; } }catch(e){}
  return blank();
}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }

/* ============ cálculo ============ */
function sc(id){
  var s=S.scores[id]||{}; var imp=0;
  S.ejes.forEach(function(e){ imp += (+s[e]||0); });
  var maxImp = Math.max(1, S.ejes.length*3);
  var comp = +s.comp||3, ret = +s.ret||3;
  var total = 50*(imp/maxImp) + 25*((6-comp)/5) + 25*(ret/5);
  return {imp:imp, maxImp:maxImp, comp:comp, ret:ret, total:Math.round(total),
          quick:(comp<=2 && ret>=4)};
}
function ranked(){
  return S.dolores.filter(function(d){return d.t.trim();})
   .map(function(d){ var r=sc(d.id); r.d=d; return r; })
   .sort(function(a,b){ return b.total-a.total; });
}
function prios(){ return S.dolores.filter(function(d){ return S.prio.indexOf(d.id)>=0 && d.t.trim(); }); }
function suggest(txt){
  var t=(txt||"").toLowerCase(); var out=[];
  KITS.forEach(function(k){
    var n=0; k.k.forEach(function(w){ if(t.indexOf(w)>=0) n++; });
    if(n>0) out.push({c:k.c,n:n});
  });
  out.sort(function(a,b){return b.n-a.n;});
  return out.slice(0,3).map(function(o){return o.c;});
}
function readyAvg(id){
  var r=S.ready[id]||{}, sum=0, n=0;
  DIMS.forEach(function(d){ if(r[d.id]){ sum+=r[d.id]; n++; } });
  return n===4 ? sum/4 : null;
}

/* ============ helpers DOM ============ */
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,function(c){
  return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
var $=function(s,r){ return (r||document).querySelector(s); };
var stage=$("#stage"), rail=$("#rail");

/* ============ timer ============ */
var T={left:0, on:false, iv:null};
function setTimer(m){ T.left=m*60; T.on=false; clearInterval(T.iv); paintTimer(); $("#tgo").textContent="Iniciar"; }
function paintTimer(){
  var m=Math.floor(Math.abs(T.left)/60), s=Math.abs(T.left)%60;
  $("#tval").textContent=(T.left<0?"-":"")+m+":"+(s<10?"0":"")+s;
  $("#clock").classList.toggle("over", T.left<0);
}
$("#tgo").addEventListener("click",function(){
  T.on=!T.on; this.textContent=T.on?"Pausar":"Seguir";
  clearInterval(T.iv);
  if(T.on) T.iv=setInterval(function(){ T.left--; paintTimer(); },1000);
});

var RAIL_CADENA={
  dolores:{b:"Bloque 2 · Autodiagnóstico y priorización", t:"Puntos de fricción"},
  ready:{t:"Readiness del proveedor"},
  ficha:{t:"Tu ficha por proveedor"}
};
function paintRail(){
  var h="", lastB=null, cadena=isCadena();
  STEPS.forEach(function(st,i){
    var ov=(cadena && RAIL_CADENA[st.id])||{};
    var b=ov.b!=null?ov.b:st.b, t=ov.t!=null?ov.t:st.t;
    if(b && b!==lastB){ h+='<h5>'+esc(b)+'</h5>'; lastB=b; }
    h+='<button class="stepbtn'+(i<S.step?" done":"")+'" data-go="'+i+'" aria-current="'+(i===S.step)+'">'+
       '<span class="n">'+(i+1)+'</span><span class="t">'+esc(t)+'<small>'+esc(st.sub)+'</small></span></button>';
  });
  rail.innerHTML=h;
}
function go(i){
  S.step=Math.max(0,Math.min(STEPS.length-1,i)); save();
  setTimer(STEPS[S.step].min);
  paintRail(); paint(); window.scrollTo(0,0);
}
function nav(prevTxt,nextTxt,hint){
  return '<div class="nav noprint">'+
    (S.step>0?'<button class="btn ghost" data-go="'+(S.step-1)+'">'+esc(prevTxt||"Atrás")+'</button>':'')+
    (S.step<STEPS.length-1?'<button class="btn" data-go="'+(S.step+1)+'">'+esc(nextTxt||"Siguiente")+'</button>':'')+
    (hint?'<span class="spacer hint">'+hint+'</span>':'')+'</div>';
}
function head(t,l){ return '<div class="head"><h2>'+esc(t)+'</h2><p class="lede">'+l+'</p></div>'; }

function paint(){

function drawPlot(){

  g+='<rect x="'+L+'" y="'+T+'" width="'+(W-L-R)/2+'" height="'+(H-T-B)/2+'" fill="var(--green-soft)" opacity=".55"/>';
  g+='<rect x="'+(L+(W-L-R)/2)+'" y="'+(T+(H-T-B)/2)+'" width="'+(W-L-R)/2+'" height="'+(H-T-B)/2+'" fill="var(--red-soft)" opacity=".4"/>';
  g+='<line x1="'+L+'" y1="'+(T+(H-T-B)/2)+'" x2="'+(W-R)+'" y2="'+(T+(H-T-B)/2)+'" stroke="var(--line)" stroke-dasharray="3 4"/>';
  g+='<line x1="'+(L+(W-L-R)/2)+'" y1="'+T+'" x2="'+(L+(W-L-R)/2)+'" y2="'+(H-B)+'" stroke="var(--line)" stroke-dasharray="3 4"/>';
  g+='<line x1="'+L+'" y1="'+(H-B)+'" x2="'+(W-R)+'" y2="'+(H-B)+'" stroke="var(--line)"/>';
  g+='<line x1="'+L+'" y1="'+T+'" x2="'+L+'" y2="'+(H-B)+'" stroke="var(--line)"/>';
  g+='<text x="'+(L+8)+'" y="'+(T+18)+'" font-size="11" fill="var(--green)" font-family="var(--sans)">hacelo primero</text>';
  g+='<text x="'+(W-R-8)+'" y="'+(H-B-8)+'" font-size="11" fill="var(--red)" text-anchor="end" font-family="var(--sans)">dejalo para después</text>';
  g+='<text x="'+((L+W-R)/2)+'" y="'+(H-14)+'" font-size="12" fill="var(--ink-2)" text-anchor="middle" font-family="var(--sans)">complejidad →</text>';
  g+='<text transform="translate(18,'+((T+H-B)/2)+') rotate(-90)" font-size="12" fill="var(--ink-2)" text-anchor="middle" font-family="var(--sans)">impacto en tus ejes →</text>';
  ranked().forEach(function(r,i){
    var cx=x(r.comp), cy=y(r.imp), rr=6+r.ret*2.4;

  [1,2,3].forEach(function(lvl){

async function offerFile(blob,filename){
  if(window.claude && typeof window.claude.use==="function"){
    try{
      var downloads=await window.claude.use("downloads");
      if(downloads){
        await downloads.save({filename:filename, data:blob});
        return;
      }
    }catch(e){
      if(e && e.code==="declined") return;
      /* si falla la capability, seguimos con la descarga directa de abajo */
    }
  }
  var url=URL.createObjectURL(blob);
  var a=document.createElement("a");
  a.href=url; a.download=filename; document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(function(){ URL.revokeObjectURL(url); },2000);
}

      return {comp:r.comp, imp:r.imp, maxImp:r.maxImp, ret:r.ret, rank:i+1, pri:S.prio.indexOf(r.d.id)>=0};
    }));
    var lx=M+102, lw=W-102;
    font(true,8.6); tc(PDFC.ink); tx("Cómo leer la matriz",lx,ly+4);
    var bullets=["El número es la posición en el ranking.",
                 "El tamaño del círculo es la relación inversión / retorno.",
                 "En ámbar, las iniciativas priorizadas."];
    var by=ly+9;
    bullets.forEach(function(b){
      var L=wrap(b,8,false,lw-4);
      fill(PDFC.ink3); doc.circle(lx+1,by-1.2,.7,'F');
      font(false,8); tc(PDFC.ink2);
      L.forEach(function(ln,j){ tx(ln,lx+4,by+j*lh(8)); });
      by+=L.length*lh(8)+1.4;
    });
    var upper=pr.filter(function(r){ return r.imp/Math.max(1,r.maxImp)>=0.5; }).length;
    var qw=pr.filter(function(r){ return r.quick; });
    var lect = nPri
      ? (nPri+" iniciativa"+(nPri===1?"":"s")+" priorizada"+(nPri===1?"":"s")+", "+upper+" con impacto alto contra los ejes declarados. "+
         (qw.length
           ? "La iniciativa "+rankOf[qw[0].d.id]+" es la de menor complejidad y funciona como victoria temprana para sostener a las demás."
           : "Ninguna califica como quick win: conviene sumar una iniciativa de baja complejidad para sostener el impulso."))
      : "Todavía no hay iniciativas priorizadas.";
    by+=2.6;
    font(true,8.6); tc(PDFC.ink); tx("Lectura",lx,by); by+=lh(8.6)+.6;
    font(false,8); tc(PDFC.ink2);
    wrap(lect,8,false,lw).forEach(function(ln){ tx(ln,lx,by); by+=lh(8); });
    y=Math.max(ly+chH,by)+6;
  } else para("Faltan datos para construir la matriz.",{color:PDFC.ink3});

  /* ================= 5. iniciativas ================= */
  sec(5,"Iniciativas priorizadas",74);
  if(!pr.length) para("Sin iniciativas priorizadas.",{color:PDFC.ink3});
  pr.forEach(function(r,idx){
    var d=r.d, k=kitOf(d.id), kk=S.kits[d.id]||{}, rd=S.ready[d.id]||{}, notas=rd.notas||{};
    var PAD=4.6, IW=W-PAD*2, HD=8.6;

    var dolorL=wrap(d.t,11,true,IW);
    var costL=d.c?wrap(d.c,8.4,false,IW):[];
    var codeW=17, kNameL=[], kObL=[], kitH=0;
    if(k){
      kNameL=wrap(k.n,9.6,true,IW-codeW-8);
      kObL=wrap(k.ob,8,false,IW-codeW-8);
      kitH=Math.max(kNameL.length*lh(9.6)+kObL.length*lh(8)+1.6, 7)+6;
    }
    var colW=(IW-6)/2;
    var resL=wrap(kk.resuelve||"No declarado",8.4,false,colW);
    var noL=wrap(kk.no||"No declarado",8.4,false,colW);
    var falta=missingPrereqs(k), depL=[], depH=0;
    if(falta.length){
      depL=wrap("El kit "+kitLabel(k.c)+" apoya sobre "+falta.map(kitLabel).join(" y ")+
        ", que no fue seleccionado. Conviene resolver esa base antes o incluirla en el mismo proyecto.",7.8,false,IW-7);
      depH=depL.length*lh(7.8)+lh(7.8)+5.4;
    }
    var hasRd=DIMS.some(function(dm){ return rd[dm.id]; });
    var cellW=IW/4, rdNotes=DIMS.map(function(dm){ return notas[dm.id]?wrap(notas[dm.id],7,false,cellW-5):[]; });
    var rdH=0;
    if(hasRd){
      var maxN=Math.max.apply(null,rdNotes.map(function(L){return L.length;}));
      rdH=12.6+maxN*lh(7);
    }
    var bodyH=PAD*2+3+dolorL.length*lh(11)+(costL.length?costL.length*lh(8.4)+1.6:0)+
      (kitH?kitH+1.2:0)+4+lh(7.2)+1.6+Math.max(resL.length,noL.length)*lh(8.4)+
      (depH?depH+0.2:0)+(rdH?rdH+0.2:0);
    var totalH=HD+bodyH;

    room(totalH+5);
    stroke(PDFC.line); doc.setLineWidth(.3); doc.rect(M,y,W,totalH,'S');
    fill(PDFC.ink); doc.rect(M,y,W,HD,'F');
    font(true,7.6); tc(WHITE); tx("INICIATIVA "+(idx+1),M+PAD,y+5.7);
    var chipX=M+W-PAD, blockTop=y;
    function chip(t){
      font(true,7.4); var tw=doc.getTextWidth(t);
      fill("#3A4753"); doc.roundedRect(chipX-tw-4.4,blockTop+2,tw+4.4,4.8,1,1,'F');
      tc(WHITE); tx(t,chipX-2.2,blockTop+5.4,"right");
      chipX-=tw+6.4;
    }
    if(r.quick) chip("Quick win");

    var cy=y+HD+PAD+3;
    font(true,11); tc(PDFC.ink);
    dolorL.forEach(function(ln){ tx(ln,M+PAD,cy); cy+=lh(11); });
    if(costL.length){ cy+=1.6; font(false,8.4); tc(PDFC.ink2); costL.forEach(function(ln){ tx(ln,M+PAD,cy); cy+=lh(8.4); }); }

    if(k){
      cy+=4.6;
      fill(PDFC.steelSoft); doc.roundedRect(M+PAD,cy-3.4,IW,kitH,1.4,1.4,'F');
      font(true,8); var cwid=doc.getTextWidth(k.c)+4.4;
      fill(PDFC.steel); doc.roundedRect(M+PAD+3,cy-0.6,cwid,5,1,1,'F');
      tc(WHITE); tx(k.c,M+PAD+3+2.2,cy+2.9);
      var kx=M+PAD+3+cwid+3.4, ky=cy+2.4;
      font(true,9.6); tc(PDFC.ink); kNameL.forEach(function(ln){ tx(ln,kx,ky); ky+=lh(9.6); });
      font(false,8); tc(PDFC.ink2); kObL.forEach(function(ln){ ky+=lh(8); tx(ln,kx,ky-0.6); });
      cy+=kitH-3.4;
    }

    cy+=4;
    font(true,7.2); tc(PDFC.ink3); tx("QUÉ RESUELVE",M+PAD,cy);
    tc(PDFC.red); tx("QUÉ NO RESUELVE",M+PAD+colW+6,cy);
    cy+=lh(7.2)+1.6;
    font(false,8.4); tc(PDFC.ink);
    resL.forEach(function(ln,j){ tx(ln,M+PAD,cy+j*lh(8.4)); });
    noL.forEach(function(ln,j){ tx(ln,M+PAD+colW+6,cy+j*lh(8.4)); });
    cy+=Math.max(resL.length,noL.length)*lh(8.4);

    if(depH){
      cy+=3.4;
      fill(PDFC.amberSoft); doc.rect(M+PAD,cy-3.2,IW,depH,'F');
      fill(PDFC.amber); doc.rect(M+PAD,cy-3.2,1.5,depH,'F');
      font(true,7.8); tc(PDFC.ink); tx("Dependencia detectada",M+PAD+4.4,cy+0.6);
      font(false,7.8); tc(PDFC.ink);
      depL.forEach(function(ln,j){ tx(ln,M+PAD+4.4,cy+0.6+lh(7.8)*(j+1)); });
      cy+=depH-3.2;
    }

    if(rdH){
      cy+=3.4;
      stroke(PDFC.line); doc.setLineWidth(.25);
      doc.roundedRect(M+PAD,cy-3.2,IW,rdH,1.4,1.4,'S');
      DIMS.forEach(function(dm,i){
        var x=M+PAD+cellW*i;
        if(i){ stroke(PDFC.line); doc.line(x,cy-3.2,x,cy-3.2+rdH); }
        var lv=rd[dm.id]||0;
        font(true,7); tc(PDFC.ink2); tx(SHORT[dm.id]||dm.n.toUpperCase(),x+3.4,cy+0.4);
        var col=lv?PDFC[NIVCOL[lv][0]]:PDFC.ink3;
        fill(col); doc.circle(x+4.6,cy+3.9,1.25,'F');
        font(true,7.6); tc(col); tx(lv?NIVTXT[lv]:"Sin evaluar",x+7.2,cy+4.8);
        font(false,7); tc(PDFC.ink2);
        rdNotes[i].forEach(function(ln,j){ tx(ln,x+3.4,cy+8.6+j*lh(7)); });
      });
    }
    y+=totalH+5;
  });

  /* ================= 6. readiness consolidado ================= */
  if(hasReady){
    sec(6,"Readiness consolidado");
    caption("Las cuatro dimensiones estructurales del modelo acatech, evaluadas sobre las iniciativas priorizadas.");
    var dimW=52, avgW=46, iniW=(W-dimW-avgW)/pr.length;
    room(11+DIMS.length*9);
    fill(PDFC.panel2); stroke(PDFC.line); doc.setLineWidth(.3);
    doc.rect(M,y,W,7,'FD');
    font(true,7.2); tc(PDFC.ink2);
    tx("Dimensión",M+2.4,y+4.6);
    pr.forEach(function(r,i){ tx("Inic. "+(i+1),M+dimW+iniW*i+iniW/2,y+4.6,"center"); });
    tx("Promedio",M+dimW+iniW*pr.length+2.4,y+4.6);
    y+=7;
    DIMS.forEach(function(dm){
      font(true,8.4); tc(PDFC.ink); tx(dm.n,M+2.4,y+5.8);
      pr.forEach(function(r,i){
        var lv=(S.ready[r.d.id]||{})[dm.id]||0;
        fill(lv?PDFC[NIVCOL[lv][0]]:PDFC.line);
        doc.circle(M+dimW+iniW*i+iniW/2,y+4.6,1.5,'F');
      });
      var a=dimAvg[dm.id], bx=M+dimW+iniW*pr.length+2.4, bw=38;
      fill(PDFC.line2); doc.roundedRect(bx,y+3,bw,3.4,.7,.7,'F');
      if(a!==null){
        var col=a>=2.5?PDFC.green:a>=1.75?PDFC.amber:PDFC.red;
        fill(col); doc.roundedRect(bx,y+3,Math.max(1.4,bw*(a/3)),3.4,.7,.7,'F');
      }
      stroke(PDFC.line2); doc.setLineWidth(.2); doc.line(M,y+9,M+W,y+9);
      y+=9;
    });
    y+=4.5;
  }

  /* ================= 7. plan ================= */
  var acc=S.acciones.filter(function(a){ return a.q.trim(); });
  sec(hasReady?7:6,"Plan de arranque a 30 días");
  caption("Acciones comprometidas por la empresa al cierre del taller.");
  if(acc.length){
    acc.forEach(function(a,i){
      var qL=wrap(a.q,9.4,true,W-8-74);
      var rh=Math.max(qL.length*lh(9.4),5)+4.4;
      room(rh);
      fill(PDFC.steel); doc.circle(M+2.5,y+3.4,2.5,'F');
      font(true,7.2); tc(WHITE); tx(String(i+1),M+2.5,y+4.3,"center");
      font(true,9.4); tc(PDFC.ink);
      qL.forEach(function(ln,j){ tx(ln,M+8,y+4.6+j*lh(9.4)); });
      font(false,8.4); tc(PDFC.ink2);
      tx(a.w||"sin responsable",M+W-74+2,y+4.6);
      if(a.d) tx(fdate(a.d),M+W,y+4.6,"right");
      y+=rh;
      stroke(PDFC.line2); doc.setLineWidth(.2); doc.line(M,y,M+W,y);
    });
    y+=4;
  } else para("Sin acciones cargadas.",{color:PDFC.ink3});

  if(S.champion||S.bloqueo){
    room(20);
    stroke(PDFC.line); doc.setLineWidth(.3); doc.line(M,y,M+W,y); y+=4.6;
    var half=(W-8)/2;
    font(true,7.2); tc(PDFC.ink3);
    tx("LÍDER DEL PROYECTO",M,y); tx("RIESGO DE BLOQUEO DECLARADO",M+half+8,y);
    y+=lh(7.2)+1.4;
    var cL=wrap(S.champion||"No definido",9,true,half);
    var bL=wrap(S.bloqueo||"No declarado",9,true,half);
    font(true,9); tc(PDFC.ink);
    cL.forEach(function(ln,j){ tx(ln,M,y+j*lh(9)); });
    bL.forEach(function(ln,j){ tx(ln,M+half+8,y+j*lh(9)); });
    y+=Math.max(cL.length,bL.length)*lh(9)+5;
  }

  /* ================= 8. nota metodológica ================= */
  sec(hasReady?8:7,"Nota metodológica");
  para("Cómo se priorizó",{size:9,bold:true,gap:1.2});
  para("Cada punto de dolor se ponderó contra los ejes estratégicos definidos por la empresa (impacto de 0 a 3 en cada uno) y contra dos variables de viabilidad: complejidad de implementación (1 baja a 5 alta, incluye esfuerzo técnico y resistencia interna al cambio) e inversión frente a retorno esperado (1 mala relación a 5 excelente). El orden de la matriz surge de esa ponderación conjunta.",{size:8.6,color:PDFC.ink2,gap:4});
  para("Una iniciativa se marca como quick win cuando su complejidad es baja (1 o 2) y su relación inversión / retorno es alta (4 o 5).",{size:8.6,color:PDFC.ink2,gap:4});

  para("Dimensiones de readiness",{size:9,bold:true,gap:1.2});
  para("Se utilizaron las cuatro dimensiones estructurales del modelo de madurez acatech Industrie 4.0, evaluadas en tres niveles: no estamos, con brechas, estamos listos.",{size:8.6,color:PDFC.ink2,gap:2.6});
  var half2=(W-8)/2;
  room(30);
  var dy=y, maxRow=0;
  DIMS.forEach(function(dm,i){
    var col=i%2, rowi=Math.floor(i/2);
    var L=wrap(DESC[dm.id]||dm.n,8,false,half2);
    var xx=M+(half2+8)*col, yy=dy+rowi*14;
    font(false,8); tc(PDFC.ink2);
    L.forEach(function(ln,j){ tx(ln,xx,yy+j*lh(8)); });
    maxRow=Math.max(maxRow,yy+L.length*lh(8));
  });
  y=maxRow+5;
  para("Alcance",{size:9,bold:true,gap:1.2});
  para("Este documento refleja exclusivamente lo declarado por la empresa durante el taller. No constituye una auditoría ni un diagnóstico técnico verificado en planta, y los costos y métricas son estimaciones de los propios participantes. El catálogo de kits corresponde al Programa Kit 4.0 de la Secretaría de Industria, Comercio y PyME del Ministerio de Economía.",{size:8.6,color:PDFC.ink2});

  /* ================= pies ================= */
  var pages=doc.internal.getNumberOfPages();
  for(var pg=1; pg<=pages; pg++){
    doc.setPage(pg);
    stroke(PDFC.line2); doc.setLineWidth(.2); doc.line(M,281,M+W,281);
    font(false,7.4); tc(PDFC.ink3);
    tx("Relevamiento Kit 4.0 · "+(S.empresa||""),M,285.5);
    tx("Página "+pg+" de "+pages,M+W,285.5,"right");
  }

  var filename="relevamiento-kit40-"+slug(S.empresa)+".pdf";
  var blob=doc.output("blob");
  await offerFile(blob,filename);
}

/* ============ pdf por proveedor (modo cadena de valor) ============ */
async function buildPDFProveedor(prov){
  if(!(window.jspdf && window.jspdf.jsPDF)) throw new Error("jsPDF no está cargado");
  var doc=new window.jspdf.jsPDF({unit:"mm",format:"a4"});
  var M=16, W=210-M*2, BOTTOM=272, y=20;
  var WHITE="#FFFFFF";

  /* ================= primitivas (idénticas a buildPDF) ================= */
  function fill(h){ doc.setFillColor.apply(doc,hx(h)); }
  function stroke(h){ doc.setDrawColor.apply(doc,hx(h)); }
  function tc(h){ doc.setTextColor.apply(doc,hx(h)); }
  function font(b,s){ doc.setFont("helvetica",b?"bold":"normal"); doc.setFontSize(s); }
  function lh(s){ return s*0.49; }
  function wrap(t,s,b,w){ font(b,s); return doc.splitTextToSize(String(t==null?"":t),Math.max(6,w)); }
  function newPage(){ doc.addPage(); y=20; }
  function room(h){ if(y+h>BOTTOM) newPage(); }
  function tx(str,x,yy,align){ doc.text(str,x,yy,align?{align:align}:undefined); }
  function para(t,o){
    o=o||{};
    var s=o.size||9.6, b=!!o.bold, c=o.color||PDFC.ink, ind=o.indent||0, w=(o.w||W)-ind;
    var L=wrap(t,s,b,w), H=lh(s);
    L.forEach(function(ln){ room(H); font(b,s); tc(c); tx(ln,M+ind,y); y+=H; });
    y+=(o.gap==null?1.8:o.gap);
  }
  function sec(no,title,need){
    room(need||16); y+=3;
    fill(PDFC.steel); doc.roundedRect(M,y-4.5,5.8,5.8,1,1,'F');
    font(true,8); tc(WHITE); tx(String(no),M+2.9,y-0.55,"center");
    font(true,11); tc(PDFC.ink); tx(title,M+8.8,y);
    y+=2.8; stroke(PDFC.line); doc.setLineWidth(.3); doc.line(M,y,M+W,y); y+=5.4;
  }
  function caption(t){ para(t,{size:8.6,color:PDFC.ink2,gap:2.6}); }
  function callout(title,body,kind){
    var bar = kind==="steel"?PDFC.steel:PDFC.amber;
    var bg  = kind==="steel"?PDFC.steelSoft:PDFC.amberSoft;
    var iw=W-9.4;
    var tl=title?wrap(title,8.4,true,iw):[];
    var bl=wrap(body,8.4,false,iw);
    var h=(tl.length+bl.length)*lh(8.4)+6.4;
    room(h+3);
    fill(bg); doc.rect(M,y,W,h,'F');
    fill(bar); doc.rect(M,y,1.7,h,'F');
    var cy=y+4.6;
    font(true,8.4); tc(PDFC.ink);
    tl.forEach(function(ln){ tx(ln,M+5.6,cy); cy+=lh(8.4); });
    font(false,8.4); tc(PDFC.ink);
    bl.forEach(function(ln){ tx(ln,M+5.6,cy); cy+=lh(8.4); });
    y+=h+4.5;
  }
  function kpis(items){
    var h=19.5, cw=W/items.length;
    room(h+5);
    stroke(PDFC.line); doc.setLineWidth(.3);
    doc.roundedRect(M,y,W,h,1.5,1.5,'S');
    items.forEach(function(it,i){
      var x=M+cw*i;
      if(i){ stroke(PDFC.line); doc.line(x,y,x,y+h); }
      font(true,16.5); tc(PDFC.ink); tx(it.v,x+4.6,y+9.4);
      if(it.v2){ var vw=doc.getTextWidth(it.v); font(false,9); tc(PDFC.ink3); tx(it.v2,x+4.6+vw+1.6,y+9.4); }
      var L=wrap(it.l,7.2,false,cw-9);
      font(false,7.2); tc(PDFC.ink2);
      L.slice(0,2).forEach(function(ln,j){ tx(ln,x+4.6,y+13.6+j*3.3); });
    });
    y+=h+5;
  }
  function table(cols,rows,o){
    o=o||{};
    var s=o.size||8.4, hs=7.2, pad=2.2, vp=2.3;
    function cellX(c,x){ return c.align==="c"?x+c.w/2 : c.align==="r"?x+c.w-pad : x+pad; }
    function al(c){ return c.align==="c"?"center":c.align==="r"?"right":undefined; }
    function drawHead(){
      var hh=Math.max.apply(null,cols.map(function(c){ return wrap(c.label,hs,true,c.w-pad*2).length; }))*lh(hs)+vp*2;
      if(y+hh+12>BOTTOM) newPage();
      fill(PDFC.panel2); stroke(PDFC.line); doc.setLineWidth(.3);
      doc.rect(M,y,W,hh,'FD');
      var x=M;
      cols.forEach(function(c){
        var L=wrap(c.label,hs,true,c.w-pad*2);
        font(true,hs); tc(PDFC.ink2);
        L.forEach(function(ln,j){ tx(ln,cellX(c,x),y+vp+lh(hs)*(j+1)-1.1,al(c)); });
        x+=c.w;
      });
      y+=hh;
    }
    drawHead();
    rows.forEach(function(r){
      var LL=cols.map(function(c,i){ return wrap(r.cells[i],s,c.bold,c.w-pad*2); });
      var rh=Math.max.apply(null,LL.map(function(L){return L.length;}))*lh(s)+vp*2;
      if(y+rh>BOTTOM){ newPage(); drawHead(); }
      if(r.hl){ fill(PDFC.amberSoft); doc.rect(M,y,W,rh,'F'); }
      var x=M;
      cols.forEach(function(c,i){
        font(c.bold,s); tc(r.mute?PDFC.ink3:(c.color||PDFC.ink));
        LL[i].forEach(function(ln,j){ tx(ln,cellX(c,x),y+vp+lh(s)*(j+1)-1.1,al(c)); });
        x+=c.w;
      });
      stroke(PDFC.line2); doc.setLineWidth(.2); doc.line(M,y+rh,M+W,y+rh);
      y+=rh;
    });
    y+=(o.gap==null?4.5:o.gap);
  }
  function chart(x0,y0,w,h,pts){
    var L=x0+9, R=x0+w-4, T=y0+4, B=y0+h-10;
    stroke(PDFC.line); doc.setLineWidth(.3); doc.rect(x0,y0,w,h,'S');
    var MX=(L+R)/2, MY=(T+B)/2;
    fill(PDFC.greenSoft); doc.rect(L,T,MX-L,MY-T,'F');
    fill(PDFC.redSoft);   doc.rect(MX,MY,R-MX,B-MY,'F');
    stroke(PDFC.line); doc.setLineWidth(.2);
    doc.line(L,MY,R,MY); doc.line(MX,T,MX,B);
    stroke(PDFC.ink3); doc.setLineWidth(.3);
    doc.line(L,B,R,B); doc.line(L,T,L,B);
    font(false,6.4); tc(PDFC.green); tx("hacelo primero",L+2,T+4);
    tc(PDFC.red); tx("dejalo para después",R-2,B-2.4,"right");
    font(false,7); tc(PDFC.ink2); tx("complejidad de implementación",MX,B+6,"center");
    var ytw=doc.getTextWidth("impacto en los ejes");
    doc.text("impacto en los ejes",x0+6.4,MY+ytw/2,{angle:90});
    var placed=[];
    pts.forEach(function(p){
      var cx=L+(p.comp-1)/4*(R-L);
      var cy=B-(p.imp/Math.max(1,p.maxImp))*(B-T);
      var r=2.0+p.ret*0.55;
      for(var g=0; g<30; g++){
        var hit=false;
        for(var i=0;i<placed.length;i++){
          var q=placed[i], dx=cx-q.cx, dy=cy-q.cy;
          if(Math.sqrt(dx*dx+dy*dy) < r+q.r+0.7){ hit=true; break; }
        }
        if(!hit) break;
        cx += (g%2? -1:1)*(1.3*(Math.floor(g/2)+1));

  if(S.persona) contactL.push(S.persona+(S.rol?" · "+S.rol:""));
  para("Contacto en "+(S.empresa||"la empresa"),{size:8.6,bold:true,color:PDFC.ink2,gap:1.2});
  para(contactL.length?contactL.join(" · "):"A coordinar.",{size:9.6});

  /* ================= 8. nota metodológica ================= */
  sec(hasReady?8:7,"Nota metodológica");
  para("Cómo se priorizó",{size:9,bold:true,gap:1.2});
  para("Cada punto de fricción se ponderó contra los ejes estratégicos definidos por la empresa (impacto de 0 a 3 en cada uno) y contra dos variables de viabilidad: complejidad de implementación (1 baja a 5 alta, incluye esfuerzo técnico y resistencia interna al cambio) e inversión frente a retorno esperado (1 mala relación a 5 excelente). El orden de la matriz surge de esa ponderación conjunta.",{size:8.6,color:PDFC.ink2,gap:4});
  para("Una iniciativa se marca como quick win cuando su complejidad es baja (1 o 2) y su relación inversión / retorno es alta (4 o 5).",{size:8.6,color:PDFC.ink2,gap:4});

  para("Dimensiones de readiness",{size:9,bold:true,gap:1.2});
  para("Se utilizaron las cuatro dimensiones estructurales del modelo de madurez acatech Industrie 4.0, evaluadas en tres niveles: no estamos, con brechas, estamos listos. Aplicadas acá a "+prov+", según la percepción de "+(S.empresa||"la empresa")+".",{size:8.6,color:PDFC.ink2,gap:2.6});
  var half2=(W-8)/2;
  room(30);
  var dy=y, maxRow=0;
  DIMS.forEach(function(dm,i){
    var col=i%2, rowi=Math.floor(i/2);
    var L=wrap(DESC[dm.id]||dm.n,8,false,half2);
    var xx=M+(half2+8)*col, yy=dy+rowi*14;
    font(false,8); tc(PDFC.ink2);
    L.forEach(function(ln,j){ tx(ln,xx,yy+j*lh(8)); });
    maxRow=Math.max(maxRow,yy+L.length*lh(8));
  });
  y=maxRow+5;
  para("Alcance",{size:9,bold:true,gap:1.2});
  para("Este documento refleja exclusivamente lo declarado por "+(S.empresa||"la empresa")+" durante el taller. No constituye una auditoría ni un diagnóstico técnico verificado, y los costos y métricas son estimaciones de los propios participantes. El catálogo de kits corresponde al Programa Kit 4.0 de la Secretaría de Industria, Comercio y PyME del Ministerio de Economía.",{size:8.6,color:PDFC.ink2});

  /* ================= pies ================= */
  var pages=doc.internal.getNumberOfPages();
  for(var pg=1; pg<=pages; pg++){
    doc.setPage(pg);
    stroke(PDFC.line2); doc.setLineWidth(.2); doc.line(M,281,M+W,281);
    font(false,7.4); tc(PDFC.ink3);
    tx("Kit 4.0 · Recomendación para "+prov,M,285.5);
    tx("Página "+pg+" de "+pages,M+W,285.5,"right");
  }

  var filename="kit40-recomendacion-"+slug(prov)+".pdf";
  var blob=doc.output("blob");
  await offerFile(blob,filename);
}

/* ============ eventos ============ */
document.addEventListener("click",function(ev){
  var t=ev.target.closest("[data-go],[data-add],[data-del],[data-bank],[data-eje],[data-kit],[data-rd],[data-modo],[data-pdfprov],#pdf,#copy,#reset,#resetCancel,#resetConfirm,#addCustomEje");
  if(!t) return;

  if(t.hasAttribute("data-go")) return go(+t.getAttribute("data-go"));

  if(t.id==="pdf"){
    buildPDF().catch(function(e3){
      alert("No se pudo generar el PDF automáticamente. Probá de nuevo, o usá Ctrl+P (Cmd+P en Mac) y elegí \"Guardar como PDF\".\n\nDetalle técnico: "+e3);
    });
    return;
  }
  if(t.hasAttribute("data-pdfprov")){
    buildPDFProveedor(t.getAttribute("data-pdfprov")).catch(function(e4){
      alert("No se pudo generar el PDF automáticamente. Probá de nuevo.\n\nDetalle técnico: "+e4);
    });
    return;
  }
  if(t.id==="copy"){
    var txt=asText();
    (navigator.clipboard? navigator.clipboard.writeText(txt) : Promise.reject())
      .then(function(){ $("#copied").textContent="Copiado."; })
      .catch(function(){ $("#copied").textContent="No se pudo copiar. Usá imprimir."; });
    return;
  }
  if(t.id==="reset"){
    document.getElementById("resetModal").hidden=false;
    return;
  }
  if(t.id==="resetCancel"){
    document.getElementById("resetModal").hidden=true;
    return;
  }
  if(t.id==="resetConfirm"){
    document.getElementById("resetModal").hidden=true;
    S=blank(); save(); go(0);
    return;
  }
  if(t.hasAttribute("data-add")){ S.dolores.push(nd()); save(); paint(); return; }
  if(t.hasAttribute("data-del")){
    var id=t.getAttribute("data-del");
    S.dolores=S.dolores.filter(function(d){return d.id!==id;});
    S.prio=S.prio.filter(function(x){return x!==id;});
    delete S.scores[id]; delete S.kits[id]; delete S.ready[id];
    save(); paint(); return;
  }
  if(t.hasAttribute("data-bank")){
    var txt=(isCadena()?BANCO_PROV:BANCO)[+t.getAttribute("data-bank")];
    var slot=S.dolores.filter(function(d){return !d.t.trim();})[0];
    if(slot) slot.t=txt; else S.dolores.push({id:nd().id,t:txt,c:""});
    save(); paint(); return;
  }
  if(t.hasAttribute("data-modo")){
    S.modo=t.getAttribute("data-modo");
    save(); paintRail(); paint(); return;
  }
  if(t.hasAttribute("data-eje")){
    var e=t.getAttribute("data-eje"), i=S.ejes.indexOf(e);
    if(i>=0) S.ejes.splice(i,1);
    else if(S.ejes.length<EJE_MAX) S.ejes.push(e);
    else { t.animate?t.animate([{transform:"translateX(0)"},{transform:"translateX(-3px)"},{transform:"translateX(3px)"},{transform:"translateX(0)"}],140):0; return; }
    save(); paint(); return;
  }
  if(t.id==="addCustomEje"){
    var inp=$("#newEjeInput"); var txt=(inp&&inp.value||"").trim();
    if(!txt) return;
    if(S.ejes.length>=EJE_MAX) return;
    var cid="custom"+Date.now().toString(36)+Math.random().toString(36).slice(2,5);
    S.ejeCustom[cid]=txt; S.ejes.push(cid);
    save(); paint(); return;
  }
  if(t.hasAttribute("data-kit")){
    var id2=t.getAttribute("data-for"), c=t.getAttribute("data-kit");
    var cur=S.kits[id2]||{};
    cur.c = (cur.c===c) ? "" : c;
    S.kits[id2]=cur; save(); paint(); return;
  }
  if(t.hasAttribute("data-rd")){
    var id3=t.getAttribute("data-for"), dim=t.getAttribute("data-rd"), v=+t.getAttribute("data-v");
    var r=S.ready[id3]||{notas:{}}; if(!r.notas) r.notas={};
    r[dim] = (r[dim]===v)? 0 : v;
    S.ready[id3]=r; save();
    var lights=t.parentNode.querySelectorAll(".light");
    for(var i2=0;i2<lights.length;i2++) lights[i2].setAttribute("aria-pressed", (+lights[i2].getAttribute("data-v"))===r[dim]);
    drawRadar(id3);
    var vd=t.closest(".panel").querySelector(".verdict .txt"); if(vd) vd.innerHTML=verdict(readyAvg(id3),r);
    return;
  }
});

stage.addEventListener("input",function(ev){
  var el=ev.target;
  if(el.hasAttribute("data-k")){ S[el.getAttribute("data-k")]=el.value; save();
    if(el.getAttribute("data-k")==="empresa"||el.getAttribute("data-k")==="persona")
      $("#who").textContent=S.empresa?S.empresa+(S.persona?" · "+S.persona:""):"";
    return; }
  if(el.hasAttribute("data-p")){
    var d=S.dolores.filter(function(x){return x.id===el.getAttribute("data-id");})[0];
    if(d) d[el.getAttribute("data-p")]=el.value; save(); return;
  }
  if(el.hasAttribute("data-met")){ S.metricas[el.getAttribute("data-met")]=el.value; save(); return; }
  if(el.hasAttribute("data-kf")){
    var kid=el.getAttribute("data-for"), f=el.getAttribute("data-kf");
    S.kits[kid]=S.kits[kid]||{}; S.kits[kid][f]=el.value; save(); return;
  }
  if(el.hasAttribute("data-rn")){
    var rid=el.getAttribute("data-for"), rf=el.getAttribute("data-rn");
    var rr=S.ready[rid]||{}; rr.notas=rr.notas||{}; rr.notas[rf]=el.value; S.ready[rid]=rr; save(); return;
  }
  if(el.hasAttribute("data-a")){
    S.acciones[+el.getAttribute("data-a")][el.getAttribute("data-af")]=el.value; save(); return;
  }
});

stage.addEventListener("change",function(ev){
  var el=ev.target;
  if(el.hasAttribute("data-s")){
    var id=el.getAttribute("data-s"); S.scores[id]=S.scores[id]||{};
    S.scores[id][el.getAttribute("data-f")]=+el.value; save(); refreshMatrix(); return;
  }
  if(el.hasAttribute("data-pick")){
    var pid=el.getAttribute("data-pick"), i=S.prio.indexOf(pid);
    if(el.checked && i<0) S.prio.push(pid);
    if(!el.checked && i>=0) S.prio.splice(i,1);
    save(); refreshMatrix(); return;
  }
});

stage.addEventListener("blur",function(ev){
  if(ev.target.hasAttribute("data-p") && ev.target.getAttribute("data-p")==="t") paint();
},true);
stage.addEventListener("keydown",function(ev){
  if(ev.key==="Enter" && ev.target.id==="newEjeInput"){
    ev.preventDefault();
    var b=$("#addCustomEje"); if(b) b.click();
  }
});
document.addEventListener("keydown",function(ev){
  if(ev.key==="Escape"){ var m=document.getElementById("resetModal"); if(m && !m.hidden) m.hidden=true; }
});
document.getElementById("resetModal").addEventListener("click",function(ev){
  if(ev.target===this) this.hidden=true;
});

/* ============ arranque ============ */
paintRail(); setTimer(STEPS[S.step].min); paint();
})();
</script>
</body>
</html>
